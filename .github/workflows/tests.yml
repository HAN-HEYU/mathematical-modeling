name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check selected features
        run: >-
          python scripts/check_env.py --features data visualization excel
          optimization integer-optimization statistics machine-learning
          time-series symbolic notebook graph image
      - name: Run tests
        run: python -m pytest -q
